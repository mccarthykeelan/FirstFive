<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FirstFive | Home</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- Header -->
    <header class="header">
        <button class="icon-button menu-button">
            ☰
        </button>

        <div class="logo">
            <span>First</span><span class="green">Five</span>
        </div>

        <button class="icon-button notification-button">
            ♧
            <span class="notification-dot"></span>
        </button>
    </header>


    <!-- Main Content -->
    <main>

        <!-- Hero -->
        <section class="hero">

            <div class="hero-content">
                <h1>
                    Ready to<br>
                    <span>move?</span>
                </h1>

                <p>
                    Every step counts.<br>
                    You've got this!
                </p>
            </div>

            <div class="runner">
                <img src="runner.png" alt="Runner">
            </div>

        </section>


        <!-- Start Workout -->
        <button class="start-workout">
            <span class="running-icon">🏃</span>
            START WORKOUT
        </button>


        <!-- Today's Workout -->
        <section class="card">

            <div class="card-icon">
                📅
            </div>

            <div class="card-content">
                <span class="small-text">Today</span>
                <h2>Week 2 - Day 1</h2>
                <span class="sub-text">25 min</span>
            </div>

            <span class="arrow">›</span>

        </section>


        <!-- Plan -->
        <section class="card">

            <div class="card-icon">
                📅
            </div>

            <div class="card-content">
                <span class="small-text">Your Plan</span>
                <h2>Week 2 of 9</h2>
                <span class="sub-text">3 workouts this week</span>
            </div>

            <span class="arrow">›</span>

        </section>

    </main>


    <!-- Bottom Navigation -->
    <nav class="bottom-nav">

        <a class="nav-item active">
            <span class="nav-icon">⌂</span>
            <span>Home</span>
        </a>

        <a class="nav-item">
            <span class="nav-icon">▣</span>
            <span>Workouts</span>
        </a>

        <a class="nav-item">
            <span class="nav-icon">♙</span>
            <span>More</span>
        </a>

    </nav>


    <script src="script.js"></script>

</body>

</html>
