<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign In | First Five</title>
    <link rel="stylesheet" href="style.css">

</head>

<body>
    <main>
        <div class="hero">
            <div class="hero__logo">
                <h1>First<span>Five</span></h1>
                <p>Your Journey Starts Now.</p>
            </div>
            <div class="hero__details">
                <h2>Log In</h2>
                <p>Welcome back! Log in to <br>continue your 5K journey.</p>
            </div>
        </div>
        <form action="" class="login-form">
            <label for="email">Email</label>
            <input type="email" name="email" id="email" autocomplete="email" required>
            <label for="password">Password</label>
            <input type="password" name="password" id="password" autocomplete="current-password" required>
            <a href="#">Forgot password?</a>
            <button type="submit">LOG IN</button>
        </form>
        <div class="login__breaker">
            <span>OR</span>
        </div>
        <div class="social-login">

            <!-- Apple -->

            <button type="button" class="social-button">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
                    <path
                        d="M17.05 20.28C16.07 21.23 15 21.08 13.97 20.63C12.88 20.17 11.88 20.15 10.73 20.63C9.29 21.25 8.53 21.07 7.67 20.28C2.79 15.25 3.51 7.59 9.05 7.31C10.39 7.38 11.5 8.05 12.44 8.11C13.84 7.83 15.18 7.14 16.67 7.27C18.46 7.42 19.81 8.12 20.7 9.37C17.01 11.59 17.89 16.48 21.28 17.85C20.6 19.35 19.72 20.84 17.05 20.28ZM12.34 7.25C12.16 5.02 14 3.18 16.07 3C16.36 5.58 13.73 7.5 12.34 7.25Z" />
                </svg>

                <span>Continue with Apple</span>

            </button>


            <!-- Google -->

            <button type="button" class="social-button">

                <svg width="25" height="25" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">

                    <path fill="#4285F4"
                        d="M21.35 12.23c0-.79-.07-1.55-.2-2.28H12v4.31h5.24a4.48 4.48 0 0 1-1.94 2.94v2.45h3.14c1.84-1.69 2.91-4.18 2.91-7.42z" />

                    <path fill="#34A853"
                        d="M12 21.5c2.63 0 4.84-.87 6.46-2.35l-3.14-2.45c-.87.58-1.98.92-3.32.92-2.55 0-4.71-1.72-5.49-4.03H3.27v2.53A9.76 9.76 0 0 0 12 21.5z" />

                    <path fill="#FBBC05"
                        d="M6.51 13.59A5.87 5.87 0 0 1 6.2 12c0-.55.11-1.09.31-1.59V7.88H3.27A9.76 9.76 0 0 0 2.25 12c0 1.57.38 3.05 1.02 4.12l3.24-2.53z" />

                    <path fill="#EA4335"
                        d="M12 6.38c1.43 0 2.71.49 3.72 1.46l2.79-2.79C16.83 3.48 14.63 2.5 12 2.5a9.76 9.76 0 0 0-8.73 5.38l3.24 2.53C7.29 8.1 9.45 6.38 12 6.38z" />

                </svg>

                <span>Continue with Google</span>

            </button>

        </div>
        <div class="signup">
            <p>Don't have an account? <a href="http://">Sign up</a></p>
        </div>
    </main>
    <script src="script.js"></script>
</body>

</html>
