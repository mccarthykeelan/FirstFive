<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Sign Up | FirstFive</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <main>

        <!-- =========================
             HEADER
        ========================== -->

        <header class="signup-header">

            <a href="login.html" class="back-button" aria-label="Go back">
                <svg width="28" height="28" viewBox="0 0 24 24" fill="none">
                    <path d="M15 18L9 12L15 6" stroke="currentColor" stroke-width="2" stroke-linecap="round"
                        stroke-linejoin="round" />
                </svg>
            </a>

            <div class="signup-logo">
                <h1>First<span>Five</span></h1>
            </div>

        </header>


        <!-- =========================
             INTRODUCTION
        ========================== -->

        <section class="signup-intro">

            <h2>Create Account</h2>

            <p>
                Join thousands of people building
                <br>
                their fitness one step at a time.
            </p>

        </section>


        <!-- =========================
             SIGN UP FORM
        ========================== -->

        <form action="" method="post" class="signup-form">

            <!-- FULL NAME -->

            <div class="form-group">

                <label for="full-name">
                    Full Name
                </label>

                <div class="input-wrapper">

                    <svg class="input-icon" width="24" height="24" viewBox="0 0 24 24" fill="none">
                        <circle cx="12" cy="7" r="4" stroke="currentColor" stroke-width="1.5" />

                        <path d="M4 21C4 17.6863 7.58172 15 12 15C16.4183 15 20 17.6863 20 21" stroke="currentColor"
                            stroke-width="1.5" stroke-linecap="round" />
                    </svg>

                    <input type="text" id="full-name" name="full_name" placeholder="Enter your full name"
                        autocomplete="name" required>

                </div>

            </div>


            <!-- EMAIL -->

            <div class="form-group">

                <label for="email">
                    Email
                </label>

                <div class="input-wrapper">

                    <svg class="input-icon" width="24" height="24" viewBox="0 0 24 24" fill="none">
                        <rect x="3" y="5" width="18" height="14" rx="1" stroke="currentColor" stroke-width="1.5" />

                        <path d="M4 7L12 13L20 7" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"
                            stroke-linejoin="round" />
                    </svg>

                    <input type="email" id="email" name="email" placeholder="Enter your email" autocomplete="email"
                        required>

                </div>

            </div>


            <!-- PASSWORD -->

            <div class="form-group">

                <label for="password">
                    Password
                </label>

                <div class="input-wrapper">

                    <svg class="input-icon" width="24" height="24" viewBox="0 0 24 24" fill="none">
                        <rect x="5" y="10" width="14" height="11" rx="2" stroke="currentColor" stroke-width="1.5" />

                        <path d="M8 10V7C8 4.79086 9.79086 3 12 3C14.2091 3 16 4.79086 16 7V10" stroke="currentColor"
                            stroke-width="1.5" stroke-linecap="round" />
                    </svg>

                    <input type="password" id="password" name="password" placeholder="Create a password"
                        autocomplete="new-password" required>

                    <button type="button" class="password-toggle" aria-label="Show password">

                        <svg width="24" height="24" viewBox="0 0 24 24" fill="none">
                            <path d="M2 12C2 12 5.5 5 12 5C18.5 5 22 12 22 12C22 12 18.5 19 12 19C5.5 19 2 12 2 12Z"
                                stroke="currentColor" stroke-width="1.5" stroke-linejoin="round" />

                            <circle cx="12" cy="12" r="3" stroke="currentColor" stroke-width="1.5" />
                        </svg>

                    </button>

                </div>

                <p class="password-hint">
                    Password must be at least 8 characters
                    <br>
                    and include a number.
                </p>

            </div>


            <!-- CONFIRM PASSWORD -->

            <div class="form-group">

                <label for="confirm-password">
                    Confirm Password
                </label>

                <div class="input-wrapper">

                    <svg class="input-icon" width="24" height="24" viewBox="0 0 24 24" fill="none">
                        <rect x="5" y="10" width="14" height="11" rx="2" stroke="currentColor" stroke-width="1.5" />

                        <path d="M8 10V7C8 4.79086 9.79086 3 12 3C14.2091 3 16 4.79086 16 7V10" stroke="currentColor"
                            stroke-width="1.5" stroke-linecap="round" />
                    </svg>

                    <input type="password" id="confirm-password" name="confirm_password"
                        placeholder="Confirm your password" autocomplete="new-password" required>

                    <button type="button" class="password-toggle" aria-label="Show password">

                        <svg width="24" height="24" viewBox="0 0 24 24" fill="none">
                            <path d="M2 12C2 12 5.5 5 12 5C18.5 5 22 12 22 12C22 12 18.5 19 12 19C5.5 19 2 12 2 12Z"
                                stroke="currentColor" stroke-width="1.5" stroke-linejoin="round" />

                            <circle cx="12" cy="12" r="3" stroke="currentColor" stroke-width="1.5" />
                        </svg>

                    </button>

                </div>

            </div>


            <!-- TERMS -->

            <div class="terms">

                <input type="checkbox" id="terms" name="terms" required>

                <label for="terms">
                    I agree to the
                    <a href="#">Terms of Service</a>
                    and
                    <a href="#">Privacy Policy</a>
                </label>

            </div>


            <!-- SIGN UP BUTTON -->

            <button type="submit" class="signup-button">
                SIGN UP
            </button>

        </form>


        <!-- =========================
             SOCIAL LOGIN BREAK
        ========================== -->

        <div class="login__breaker">
            <span>OR</span>
        </div>


        <!-- =========================
             SOCIAL SIGN UP
        ========================== -->

        <div class="social-login">

            <!-- APPLE -->

            <button type="button" class="social-button">

                <svg width="24" height="24" viewBox="0 0 24 24" fill="currentColor">
                    <path
                        d="M17.05 20.28C16.07 21.23 15 21.08 13.97 20.63C12.88 20.17 11.88 20.15 10.73 20.63C9.29 21.25 8.53 21.07 7.67 20.28C2.79 15.25 3.51 7.59 9.05 7.31C10.39 7.38 11.5 8.05 12.44 8.11C13.84 7.83 15.18 7.14 16.67 7.27C18.46 7.42 19.81 8.12 20.7 9.37C17.01 11.59 17.89 16.48 21.28 17.85C20.6 19.35 19.72 20.84 17.05 20.28ZM12.34 7.25C12.16 5.02 14 3.18 16.07 3C16.36 5.58 13.73 7.5 12.34 7.25Z" />
                </svg>

                <span>Continue with Apple</span>

            </button>


            <!-- GOOGLE -->

            <button type="button" class="social-button">

                <svg width="25" height="25" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                    <path fill="#4285F4"
                        d="M21.35 12.23c0-.79-.07-1.55-.2-2.28H12v4.31h5.24a4.48 4.48 0 0 1-1.94 2.94v2.45h3.14c1.84-1.69 2.91-4.18 2.91-7.42z" />

                    <path fill="#34A853"
                        d="M12 21.5c2.63 0 4.84-.87 6.46-2.35l-3.14-2.45c-.87.58-1.98.92-3.32.92-2.55 0-4.71-1.72-5.49-4.03H3.27v2.53A9.76 9.76 0 0 0 12 21.5z" />

                    <path fill="#FBBC05"
                        d="M6.51 13.59A5.87 5.87 0 0 1 6.2 12c0-.55.11-1.09.31-1.59V7.88H3.27A9.76 9.76 0 0 0 2.25 12c0 1.57.38 3.05 1.02 4.12l3.24-2.53z" />

                    <path fill="#EA4335"
                        d="M12 6.38c1.43 0 2.71.49 3.72 1.46l2.79-2.79C16.83 3.48 14.63 2.5 12 2.5a9.76 9.76 0 0 0-8.73 5.38l3.24 2.53C7.29 8.1 9.45 6.38 12 6.38z" />
                </svg>

                <span>Continue with Google</span>

            </button>

        </div>


        <!-- =========================
             LOGIN LINK
        ========================== -->

        <div class="signup-login">

            <p>
                Already have an account?
                <a href="login.html">Log in</a>
            </p>

        </div>

    </main>


    <script src="script.js"></script>

</body>

</html>
